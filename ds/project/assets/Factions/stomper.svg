<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -12 120 164" width="120" height="164"><title>Великий Топтун</title>
<defs>
<linearGradient id="stIron" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a7a5a"/><stop offset=".5" stop-color="#5e5038"/><stop offset="1" stop-color="#3a3020"/></linearGradient>
<linearGradient id="stRust" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a4a22"/><stop offset="1" stop-color="#5a2810"/></linearGradient>
<linearGradient id="stGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6e8a3a"/><stop offset="1" stop-color="#3e5420"/></linearGradient>
<radialGradient id="stFire" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff2c0"/><stop offset=".5" stop-color="#ffb347"/><stop offset="1" stop-color="#c8321a" stop-opacity="0"/></radialGradient>
</defs>
<ellipse cx="60" cy="150" rx="46" ry="5" fill="#000" opacity=".45"/>
<!-- ноги-тумбы -->
<g class="legL" style="transform-origin:42px 112px">
<path d="M32 112H52L54 140H30Z" fill="url(#stIron)" stroke="#1a140c" stroke-width="1.5"/>
<path d="M24 140H58L60 150H22Z" fill="url(#stRust)" stroke="#1a140c" stroke-width="1.5"/>
<path d="M34 120H50M33 130H51" stroke="#1a140c" stroke-width="1" opacity=".6"/>
</g>
<g class="legR" style="transform-origin:78px 112px">
<path d="M68 112H88L90 140H66Z" fill="url(#stIron)" stroke="#1a140c" stroke-width="1.5"/>
<path d="M62 140H96L98 150H60Z" fill="url(#stRust)" stroke="#1a140c" stroke-width="1.5"/>
<path d="M70 120H86M69 130H87" stroke="#1a140c" stroke-width="1" opacity=".6"/>
</g>
<g class="body">
<!-- трубы с дымом -->
<path d="M30 30H38V6H30Z M82 30H90V0H82Z" fill="#3a3020" stroke="#1a140c" stroke-width="1.5"/>
<circle cx="34" cy="2" r="5" fill="#555" opacity=".5" class="glowpulse"/><circle cx="86" cy="-5" r="6" fill="#555" opacity=".5" class="glowpulse"/>
<!-- знамя -->
<path d="M58 -10V22" stroke="#2a2010" stroke-width="2"/>
<path d="M59 -9L76 -4L59 4Z" fill="#b8322a" stroke="#1a140c" stroke-width="1"/>
<path d="M63 -6l4 2l-4 2z" fill="#e8dcc0"/>
<!-- пузатый корпус-котёл -->
<path d="M28 34Q22 72 30 112H90Q98 72 92 34Q60 22 28 34Z" fill="url(#stIron)" stroke="#1a140c" stroke-width="2"/>
<path d="M30 60Q60 52 90 60M28 86Q60 78 92 86" stroke="#1a140c" stroke-width="1.5" fill="none"/>
<path d="M36 40l3 0M50 36l3 0M66 36l3 0M80 40l3 0M33 66l3 0M84 66l3 0M33 92l3 0M84 92l3 0" stroke="#c8b070" stroke-width="2"/>
<!-- ржавые заплаты -->
<path d="M34 96l12 -2l1 10l-12 1z" fill="url(#stRust)" stroke="#1a140c" stroke-width="1"/>
<path d="M76 44l10 1l-1 9l-10 -1z" fill="url(#stRust)" stroke="#1a140c" stroke-width="1"/>
<!-- морда-идол: глаза и челюсть -->
<path d="M42 40L52 48L42 52Z M78 40L68 48L78 52Z" fill="#1a140c"/>
<circle cx="46" cy="47" r="2.8" fill="#ffd040" class="glowpulse"/><circle cx="74" cy="47" r="2.8" fill="#ffd040" class="glowpulse"/>
<path d="M44 56H76L72 66H48Z" fill="url(#stGreen)" stroke="#1a140c" stroke-width="1.5"/>
<path d="M48 56l2 5M54 56l2 5M60 56v5M66 56l-2 5M72 56l-2 5" stroke="#e8dcc0" stroke-width="2"/>
<!-- пушка в брюхе -->
<circle cx="60" cy="90" r="13" fill="#2a2214" stroke="#1a140c" stroke-width="2"/>
<circle cx="60" cy="90" r="8" fill="#0e0a06"/>
<circle cx="60" cy="90" r="5" fill="url(#stFire)" class="glowpulse"/>
<path d="M47 90H40M80 90H73" stroke="#c8b070" stroke-width="2"/>
<!-- левая рука: клешня -->
<g class="arm" style="transform-origin:28px 50px">
<path d="M28 46L10 56L8 84L18 86L22 62L30 58Z" fill="url(#stIron)" stroke="#1a140c" stroke-width="1.5"/>
<path d="M4 84L10 104L16 92Z M14 86L22 104L22 88Z" fill="url(#stRust)" stroke="#1a140c" stroke-width="1.5"/>
</g>
<!-- правая рука: многоствольник -->
<g class="arm" style="transform-origin:92px 50px">
<path d="M92 46L108 54L112 70L100 74L96 60L90 58Z" fill="url(#stIron)" stroke="#1a140c" stroke-width="1.5"/>
<rect x="98" y="70" width="18" height="12" fill="#3a3020" stroke="#1a140c" stroke-width="1.5"/>
<path d="M100 82V100M105 82V102M110 82V100M114 82V98" stroke="#2a2214" stroke-width="3"/>
<path d="M100 82V100M105 82V102M110 82V100M114 82V98" stroke="#8a7a5a" stroke-width="1"/>
</g>
<!-- наплечная пушка -->
<path d="M70 26L74 18H96L98 26Z" fill="url(#stGreen)" stroke="#1a140c" stroke-width="1.5"/>
<rect x="94" y="19" width="20" height="5" fill="#2a2214" stroke="#1a140c" stroke-width="1"/>
</g>
</svg>
