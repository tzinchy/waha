<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -12 120 164" width="120" height="164"><title>Монолит Полуночи</title>
<defs>
<linearGradient id="mtSlab" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a4440"/><stop offset=".5" stop-color="#1c2422"/><stop offset="1" stop-color="#0c1110"/></linearGradient>
<radialGradient id="mtGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e8fff0"/><stop offset=".4" stop-color="#5affa0"/><stop offset="1" stop-color="#1a8a50" stop-opacity="0"/></radialGradient>
</defs>
<!-- тень на земле: парит -->
<ellipse cx="60" cy="150" rx="40" ry="4" fill="#000" opacity=".4"/>
<ellipse cx="60" cy="146" rx="24" ry="3" fill="#5affa0" opacity=".25" class="glowpulse"/>
<g class="body">
<!-- антигравитационное свечение снизу -->
<path d="M34 122L60 142L86 122Z" fill="url(#mtGlow)" opacity=".55" class="glowpulse"/>
<!-- корпус: усечённая пирамида с рёбрами -->
<path d="M22 122L38 24H82L98 122Z" fill="url(#mtSlab)" stroke="#060808" stroke-width="2"/>
<path d="M38 24L32 122M82 24L88 122" stroke="#c8a850" stroke-width="2"/>
<path d="M28 92H92M33 60H87" stroke="#060808" stroke-width="1.6"/>
<path d="M46 32L42 118M74 32L78 118" stroke="#5affa0" stroke-width="1.4" opacity=".7" class="glowpulse"/>
<!-- орудие-кристалл на гранях -->
<g class="arm" style="transform-origin:22px 76px">
<path d="M22 70L6 76L22 82Z" fill="#1c2422" stroke="#060808" stroke-width="1.2"/>
<circle cx="8" cy="76" r="3" fill="#5affa0" class="glowpulse"/>
</g>
<g class="arm" style="transform-origin:98px 76px">
<path d="M98 70L114 76L98 82Z" fill="#1c2422" stroke="#060808" stroke-width="1.2"/>
<circle cx="112" cy="76" r="3" fill="#5affa0" class="glowpulse"/>
</g>
<!-- портал в нижней грани -->
<path d="M50 122V102Q60 94 70 102V122Z" fill="#061410" stroke="#c8a850" stroke-width="1.5"/>
<path d="M53 122V104Q60 98 67 104V122Z" fill="url(#mtGlow)" opacity=".7" class="glowpulse"/>
<!-- глаз-циферблат -->
<circle cx="60" cy="44" r="9" fill="#0a1210" stroke="#c8a850" stroke-width="2"/>
<circle cx="60" cy="44" r="3.4" fill="#5affa0" class="glowpulse"/>
<!-- главный кристалл: отсюда бьёт разряд -->
<path d="M48 24L60 -6L72 24Z" fill="#1c2422" stroke="#060808" stroke-width="1.5"/>
<path d="M54 22L60 2L66 22Z" fill="url(#mtGlow)" class="glowpulse"/>
<circle cx="60" cy="8" r="12" fill="url(#mtGlow)" opacity=".5" class="glowpulse"/>
</g>
</svg>
