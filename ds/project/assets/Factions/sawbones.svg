<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -12 120 164" width="120" height="164"><title>Знахарь</title>
<defs>
<linearGradient id="sbSkin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7f9e44"/><stop offset="1" stop-color="#435a1e"/></linearGradient>
<linearGradient id="sbLeather" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a4a2a"/><stop offset="1" stop-color="#3a2614"/></linearGradient>
<linearGradient id="sbIron" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8b0a0"/><stop offset="1" stop-color="#5a5448"/></linearGradient>
</defs>
<ellipse cx="60" cy="150" rx="26" ry="4" fill="#000" opacity=".45"/>
<g class="legL" style="transform-origin:50px 108px">
<path d="M44 108H56L55 140H45Z" fill="url(#sbLeather)" stroke="#1a140c" stroke-width="1.5"/>
<path d="M40 140H56L57 150H38Z" fill="#2a1e10" stroke="#1a140c" stroke-width="1.5"/>
</g>
<g class="legR" style="transform-origin:70px 108px">
<path d="M64 108H76L75 140H65Z" fill="url(#sbLeather)" stroke="#1a140c" stroke-width="1.5"/>
<path d="M64 140H80L82 150H63Z" fill="#2a1e10" stroke="#1a140c" stroke-width="1.5"/>
</g>
<g class="body">
<!-- сгорбленный торс -->
<path d="M36 56Q34 40 52 36H72Q88 40 86 60L80 112H40Z" fill="url(#sbSkin)" stroke="#1a140c" stroke-width="2"/>
<!-- кожаный фартук с пятнами -->
<path d="M44 62H78L76 118H46Z" fill="url(#sbLeather)" stroke="#1a140c" stroke-width="1.5"/>
<circle cx="56" cy="80" r="3" fill="#7a1a14"/><circle cx="66" cy="96" r="2.2" fill="#7a1a14"/><path d="M52 104q4 4 2 8" stroke="#7a1a14" stroke-width="2" fill="none"/>
<path d="M56 70h10M61 65v10" stroke="#e8dcc0" stroke-width="2.5"/>
<!-- склянки на поясе -->
<rect x="42" y="98" width="5" height="9" rx="1" fill="#6ae06a" opacity=".85" stroke="#1a140c"/><rect x="74" y="98" width="5" height="9" rx="1" fill="#d04040" opacity=".85" stroke="#1a140c"/>
<!-- голова: выдвинута вперёд, клыки, окуляры -->
<g class="head">
<path d="M46 24Q46 8 60 8Q76 8 76 24L74 38Q60 46 48 38Z" fill="url(#sbSkin)" stroke="#1a140c" stroke-width="2"/>
<path d="M40 18L48 22L46 26Z M80 18L72 22L74 26Z" fill="url(#sbSkin)" stroke="#1a140c" stroke-width="1.5"/>
<path d="M46 20H74" stroke="#2a1e10" stroke-width="3"/>
<circle cx="54" cy="21" r="5" fill="#2a1e10" stroke="#c8b070" stroke-width="1.5"/><circle cx="54" cy="21" r="2.6" fill="#ff5a3a" class="glowpulse"/>
<circle cx="67" cy="21" r="4" fill="#2a1e10" stroke="#c8b070" stroke-width="1.5"/><circle cx="67" cy="21" r="2" fill="#ffd040"/>
<path d="M50 34H70" stroke="#1a140c" stroke-width="2"/>
<path d="M52 34l2 -5l2 5M64 34l2 -5l2 5" fill="#e8dcc0" stroke="#1a140c" stroke-width=".8"/>
</g>
<!-- левая рука: огромный шприц -->
<g class="arm" style="transform-origin:38px 48px">
<path d="M38 46L22 60L26 78L32 76L30 62L42 56Z" fill="url(#sbSkin)" stroke="#1a140c" stroke-width="1.5"/>
<rect x="18" y="74" width="16" height="7" fill="#d8e8c8" stroke="#1a140c" stroke-width="1.2" transform="rotate(60 26 78)"/>
<rect x="21" y="76" width="9" height="3.5" fill="#6ae06a" transform="rotate(60 26 78)"/>
<path d="M28 90L34 104" stroke="url(#sbIron)" stroke-width="2"/>
</g>
<!-- правая рука: пила -->
<g class="arm" style="transform-origin:84px 48px">
<path d="M84 46L98 58L96 76L90 76L90 62L80 56Z" fill="url(#sbSkin)" stroke="#1a140c" stroke-width="1.5"/>
<path d="M90 72L112 52L116 58L96 80Z" fill="url(#sbIron)" stroke="#1a140c" stroke-width="1.2"/>
<path d="M98 66l3 3M102 62l3 3M106 58l3 3M110 55l3 3" stroke="#1a140c" stroke-width="1.2"/>
<rect x="86" y="74" width="8" height="8" fill="url(#sbLeather)" stroke="#1a140c" stroke-width="1"/>
</g>
</g>
</svg>
