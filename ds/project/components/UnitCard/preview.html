<!-- @dsCard group="HUD" height=230 subtitle="lc-unit — портрет, имя, жизнь, характеристики" -->
<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>UnitCard</title>
<style>
  html, body { margin: 0; }
  body { background: var(--surface-100); color: var(--ink); font-family: var(--font-body); padding: 24px; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .col { display: grid; gap: 16px; }
  .cap { font: 500 11px/14px var(--font-label); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 8px; }
</style>
</head>
<body>
<section class="lc-frame" style="width:380px">
  <div class="lc-unit">
    <div class="lc-unit__portrait"><svg viewBox="0 0 56 72" aria-hidden="true"><path d="M28 2 34 8h4v6h4v8h4v26c0 10-8 18-18 22C18 66 10 58 10 48V22h4v-8h4V8h4Z" fill="currentColor"/><path d="M26 22h4v26l-2 6-2-6Z" fill="var(--surface-000)"/><path d="M16 34h24v4H16Z" fill="var(--surface-000)"/></svg><span class="lc-unit__rank">III</span></div>
    <div>
      <h3 class="lc-unit__name">Латунный Стражник</h3>
      <p class="lc-unit__class">Пехота · Тяжёлая броня</p>
      <div class="lc-vitals">
        <div class="lc-vitals__bar lc-vitals__bar--shield" style="--v:70%"></div>
        <div class="lc-vitals__bar" style="--v:92%"></div>
        <div class="lc-vitals__nums"><span>Щит <b>140</b></span><span><b>460/500</b></span></div>
      </div>
      <p class="lc-unit__stats"><span>БРОНЯ <b>6</b></span><span>УРОН <b>18×2</b></span><span>ДАЛ. <b>7</b></span><span>СКОР. <b>2.4</b></span></p>
    </div>
  </div>
</section>
</body>
</html>
