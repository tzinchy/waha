<!-- @dsCard group="HUD" height=210 subtitle="lc-tip — имя, цена, описание, требование" -->
<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Tooltip</title>
<style>
  html, body { margin: 0; }
  body { background: var(--surface-100); color: var(--ink); font-family: var(--font-body); padding: 24px; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .col { display: grid; gap: 16px; }
  .cap { font: 500 11px/14px var(--font-label); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 8px; }
</style>
</head>
<body>
<div class="row" style="align-items:flex-start">
  <div class="lc-tip" role="tooltip">
    <p class="lc-tip__title"><strong>Лампа-маяк</strong><kbd>L</kbd></p>
    <p class="lc-tip__cost"><span>◆ 200 влияния</span><span class="lack">2 реликвии</span><span>⧗ 45 с</span></p>
    <p class="lc-tip__body">Освещает туман войны в радиусе 12. Союзники рядом получают <em>+15% к броне</em>.</p>
    <p class="lc-tip__req">Нужно: ещё 1 реликвия · Собор II ранга</p>
  </div>
</div>
</body>
</html>
