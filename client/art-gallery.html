<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WAHA · Армии и полководцы</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/beauty.css"></head><body class="beauty"><nav class="art-nav"><a class="art-brand" href="/home.html">WAHA</a><div class="art-nav-links"><a href="/home.html">Главная</a><a href="/lobby-lab.html">Военный совет</a><a href="/index.html">Сетевое лобби ↗</a></div></nav><main class="art-content"><div class="art-section-head"><div><div class="eyebrow">ПОЛКОВОДЦЫ // ЭЛИТА // АРХИТЕКТУРА</div><h1 style="font:clamp(42px,5vw,70px)/1.05 Georgia;margin:18px 0">Лица вечной войны.</h1></div><p>Детализированные изображения армий: металл, броня, шрамы, кость и энергия. Открой персонажа, чтобы рассмотреть детали.</p></div><div class="art-tabs" id="tabs"></div><div class="art-gallery" id="gallery"></div></main><footer class="art-footer"><span>WAHA // ХУДОЖЕСТВЕННАЯ КОЛЛЕКЦИЯ</span><a href="/animation-gallery.html">Открыть анимации и модели ↗</a></footer><dialog class="art-dialog" id="detail"><button id="close" aria-label="Закрыть изображение">✕</button><img id="large" alt=""></dialog>
<script type="module">import {factions,artworks} from './art-collection.js';const gallery=document.getElementById('gallery'),tabs=document.getElementById('tabs'),dialog=document.getElementById('detail');function render(id){gallery.replaceChildren();for(const art of artworks.filter(a=>id==='all'||a.faction===id)){const f=factions.find(f=>f.id===art.faction),figure=document.createElement('figure');figure.className='art-piece';figure.style.setProperty('--faction-glow',f.glow);const img=new Image();img.src=art.image;img.alt=art.title;img.loading='lazy';img.tabIndex=0;const open=()=>{const large=document.getElementById('large');large.src=art.image;large.alt=art.title;dialog.showModal();};img.onclick=open;img.onkeydown=e=>{if(e.key==='Enter')open()};const caption=document.createElement('figcaption'),eyebrow=document.createElement('div');eyebrow.className='eyebrow';eyebrow.textContent=f.name+' // '+art.type;const h=document.createElement('h2');h.textContent=art.title;const p=document.createElement('p');p.textContent=art.detail;const download=document.createElement('a');download.href=art.image;download.className='art-download';download.textContent='ОТКРЫТЬ ИЗОБРАЖЕНИЕ ↗';caption.append(eyebrow,h,p,download);figure.append(img,caption);gallery.append(figure);}for(const b of tabs.children)b.classList.toggle('active',b.dataset.id===id);}for(const f of [{id:'all',name:'Все армии'},...factions]){const b=document.createElement('button');b.textContent=f.name;b.dataset.id=f.id;b.onclick=()=>{history.replaceState(null,'','#'+f.id);render(f.id)};tabs.append(b)}const selected=location.hash.slice(1);render(factions.some(f=>f.id===selected)?selected:'all');document.getElementById('close').onclick=()=>dialog.close();dialog.onclick=e=>{if(e.target===dialog)dialog.close()};</script></body></html>
