<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Армии и анимации</title>
<link rel="stylesheet" href="/ds/tokens.css">
<link rel="stylesheet" href="/ds/bundle.css">
<style>
  body{margin:0;padding:20px 24px 60px;background:var(--surface-100);color:var(--ink);font-family:var(--font-body)}
  h1{font:600 28px/32px var(--font-display);color:var(--gilt-300);margin:0}
  h2{font:600 18px/24px var(--font-display);color:var(--gilt-300);margin:26px 0 10px;border-bottom:1px solid var(--gilt-700);padding-bottom:4px}
  .sub{color:var(--ink-muted);margin:4px 0 14px;font-size:14px}
  .tabs{display:flex;flex-wrap:wrap;gap:8px;position:sticky;top:0;background:var(--surface-100);padding:8px 0;z-index:5}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
  .card{background:var(--surface-000);border:1px solid var(--gilt-700);padding:8px 10px}
  .card b{font:600 14px/18px var(--font-display);color:var(--gilt-300)}
  .card small{display:block;color:var(--ink-muted);font-size:12px;margin-bottom:4px}
  .anims{display:flex;gap:4px;align-items:flex-end}
  .anims figure{margin:0;display:grid;justify-items:center;gap:2px;overflow:hidden;padding:0 6px}
  .card{overflow:hidden}
  .anims figcaption{font:500 10px/12px var(--font-label);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
  .anims .art{height:96px;display:flex;align-items:flex-end}
  .big .anims .art{height:180px}
  .fxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .fx{background:var(--surface-000);border:1px solid var(--gilt-700);padding:8px}
  .fx svg{width:100%;height:120px;display:block}
  .fx b{display:block;font:500 12px/16px var(--font-label);color:var(--gilt-300)}
  .fx small{color:var(--ink-muted);font-size:12px}
</style>
</head>
<body>
<h1>Армии и анимации</h1>
<p class="sub">Все юниты, постройки и удары каждой фракции — из данных игры. Анимации зациклены.</p>
<div class="tabs" id="tabs"></div>
<div id="out"></div>
<h2>Виды оружия и эффекты</h2>
<div class="fxgrid" id="fx"></div>
<script type="module" src="./anims.ts"></script>
</body>
</html>
