<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><title>Монолит</title>
<defs>
<linearGradient id="mnSlab" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a4440"/><stop offset=".5" stop-color="#1c2422"/><stop offset="1" stop-color="#0c1110"/></linearGradient>
<linearGradient id="mnTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5852"/><stop offset="1" stop-color="#242c2a"/></linearGradient>
<radialGradient id="mnGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e8fff0"/><stop offset=".4" stop-color="#5affa0"/><stop offset="1" stop-color="#1a8a50" stop-opacity="0"/></radialGradient>
</defs>
<ellipse cx="100" cy="190" rx="78" ry="8" fill="#000" opacity=".5"/>
<!-- ступенчатое основание -->
<path d="M18 190L28 172H172L182 190Z" fill="url(#mnTop)" stroke="#060808" stroke-width="2"/>
<!-- тело монолита: усечённая пирамида -->
<path d="M36 172L58 40H142L164 172Z" fill="url(#mnSlab)" stroke="#060808" stroke-width="2.5"/>
<path d="M58 40L50 172M142 40L150 172" stroke="#c8a850" stroke-width="2.5" opacity=".9"/>
<path d="M46 120H154M52 84H148" stroke="#060808" stroke-width="2"/>
<!-- светящиеся желоба -->
<path d="M70 52L64 166M130 52L136 166" stroke="#5affa0" stroke-width="2" opacity=".75" class="glowpulse"/>
<path d="M60 102H140" stroke="#5affa0" stroke-width="1.5" opacity=".5" class="glowpulse"/>
<!-- врата-портал -->
<path d="M80 172V138Q100 124 120 138V172Z" fill="#061410" stroke="#c8a850" stroke-width="2"/>
<path d="M84 172V140Q100 130 116 140V172Z" fill="url(#mnGlow)" opacity=".7" class="glowpulse"/>
<!-- циферблат-глаз -->
<circle cx="100" cy="66" r="15" fill="#0a1210" stroke="#c8a850" stroke-width="2.5"/>
<path d="M100 54V66L108 72" stroke="#c8a850" stroke-width="2" fill="none"/>
<circle cx="100" cy="66" r="5" fill="#5affa0" class="glowpulse"/>
<!-- кристалл на вершине -->
<path d="M84 40L100 6L116 40Z" fill="#1c2422" stroke="#060808" stroke-width="2"/>
<path d="M92 38L100 16L108 38Z" fill="url(#mnGlow)" class="glowpulse"/>
<circle cx="100" cy="26" r="16" fill="url(#mnGlow)" opacity=".45" class="glowpulse"/>
<!-- боковые пилоны -->
<path d="M14 172L22 110L30 172Z M170 172L178 110L186 172Z" fill="url(#mnSlab)" stroke="#060808" stroke-width="1.5"/>
<circle cx="22" cy="108" r="5" fill="#5affa0" class="glowpulse"/><circle cx="178" cy="108" r="5" fill="#5affa0" class="glowpulse"/>
</svg>
