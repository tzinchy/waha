<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><title>Пламенный идол</title>
<defs>
<linearGradient id="aiStone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6b5a52"/><stop offset=".55" stop-color="#3f322e"/><stop offset="1" stop-color="#231b19"/></linearGradient>
<linearGradient id="aiBlood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8e2a22"/><stop offset="1" stop-color="#4a1410"/></linearGradient>
<radialGradient id="aiFire" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff2c0"/><stop offset=".45" stop-color="#ff9a3a"/><stop offset="1" stop-color="#c8321a" stop-opacity="0"/></radialGradient>
</defs>
<ellipse cx="100" cy="188" rx="70" ry="9" fill="#000" opacity=".45"/>
