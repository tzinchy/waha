<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Alert</title>
<style>
  html, body { margin: 0; }
  body { background: var(--surface-100); color: var(--ink); font-family: var(--font-body); padding: 24px; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .col { display: grid; gap: 16px; }
  .cap { font: 500 11px/14px var(--font-label); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 8px; }
</style>
</head>
<body>
<div class="col" style="max-width:520px">
  <div class="lc-alert lc-alert--danger" role="alert"><span class="lc-alert__glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 23 21H1Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 9h2v6h-2zM11 17h2v2h-2z" fill="currentColor"/></svg></span><span class="lc-alert__text">Святилище атаковано</span><span class="lc-alert__meta">Квадрат Д-4</span></div>
  <div class="lc-alert lc-alert--warn" role="status"><span class="lc-alert__glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h12M6 22h12M7 2c0 6 10 6 10 10S7 16 7 22M17 2c0 6-10 6-10 10s10 4 10 10" fill="none" stroke="currentColor" stroke-width="2"/></svg></span><span class="lc-alert__text">Недостаточно энергии</span><span class="lc-alert__meta">нужно 80</span></div>
  <div class="lc-alert lc-alert--ok" role="status"><span class="lc-alert__glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 22 12 12 22 2 12Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7.5 12l3 3 6-6" fill="none" stroke="currentColor" stroke-width="2"/></svg></span><span class="lc-alert__text">Исследование завершено</span><span class="lc-alert__meta">Литьё бронзы II</span></div>
  <div class="lc-alert" role="status"><span class="lc-alert__glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 15 7H9Z" fill="currentColor"/><path d="M7 9h10l-2 9H9Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 21h12" stroke="currentColor" stroke-width="2"/></svg></span><span class="lc-alert__text">Маяк зажжён</span><span class="lc-alert__meta">00:12:40</span></div>
</div>
</body>
</html>
