<!-- @dsCard group="Каркас" height=300 subtitle="lc-frame — двойная рамка со ступенчатыми скобами" -->
<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Frame</title>
<style>
  html, body { margin: 0; }
  body { background: var(--surface-100); color: var(--ink); font-family: var(--font-body); padding: 24px; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .col { display: grid; gap: 16px; }
  .cap { font: 500 11px/14px var(--font-label); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 8px; }
</style>
</head>
<body>
<div class="row" style="align-items:stretch">
  <section class="lc-frame" style="width:300px">
    <h3 class="lc-frame__head"><span>Брифинг</span></h3>
    <p style="margin:0 0 12px; font:300 italic 17px/26px var(--font-body); color:var(--ink-muted)">«Мы строили соборы из меди, когда небо ещё было чёрным.»</p>
    <p style="margin:0; font:400 15px/22px var(--font-body)">Удержите святилище до рассвета. Пепельные Канцлеры подходят с востока.</p>
  </section>
  <section class="lc-frame lc-frame--lg" style="width:260px; margin-top:12px">
    <span class="lc-frame__plate">Цель миссии</span>
    <p style="margin:8px 0 0; font:400 15px/22px var(--font-body)">Возведите три лампы-маяка и защитите их 10 минут.</p>
  </section>
</div>
</body>
</html>
