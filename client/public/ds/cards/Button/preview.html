<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Button</title>
<style>
  html, body { margin: 0; }
  body { background: var(--surface-100); color: var(--ink); font-family: var(--font-body); padding: 24px; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .col { display: grid; gap: 16px; }
  .cap { font: 500 11px/14px var(--font-label); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 8px; }
</style>
</head>
<body>
<div class="col">
  <div class="row">
    <button class="lc-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 21h20v-3h-3v-3h-3v-3h-2V3h-4v9H8v3H5v3H2Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter"/></svg>Возвести</button>
    <button class="lc-btn lc-btn--ghost">Кодекс</button>
    <button class="lc-btn lc-btn--blood"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8l5 5v8l-5 5H8l-5-5V8Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11h8v2H8z" fill="currentColor"/></svg>Отступить</button>
    <button class="lc-btn" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 11V7a4 4 0 0 1 8 0v4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 11h14v10H5Z" fill="currentColor"/></svg>Начать осаду</button>
  </div>
  <div class="row">
    <button class="lc-btn lc-btn--sm">Принять</button>
    <button class="lc-btn lc-btn--sm lc-btn--ghost">Отмена</button>
    <button class="lc-btn lc-btn--sm lc-btn--blood">Снести</button>
  </div>
</div>
</body>
</html>
