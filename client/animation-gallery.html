<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WAHA — Каталог моделей и анимаций</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0e1215;color:#e8e3d7;font:14px system-ui}header{position:sticky;top:0;background:#171d21;border-bottom:1px solid #574b35;padding:16px 24px;z-index:2}h1{font:28px Georgia;margin:0 0 12px;color:#d4b978}.filters,.playback{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.playback{margin-top:12px;gap:20px}select,input,button{padding:9px 12px;background:#252c31;color:#fff;border:1px solid #655b4a;border-radius:5px}button{cursor:pointer}label{display:flex;align-items:center;gap:7px}.playback input{accent-color:#d4b978}main{padding:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.unit{background:#1b2226;border:1px solid #42443e;padding:14px;border-radius:8px;min-width:0}.unit h2{font:18px Georgia;margin:0 0 4px}.unit small{color:#b4ada0}.preview{margin:12px auto;width:160px;height:160px;background:radial-gradient(ellipse,#303d40,#101719);display:grid;place-items:center;border:1px solid #343d40}.preview canvas{width:160px;height:160px;image-rendering:pixelated}.unit select{width:100%;min-width:0}.unit a{display:inline-block;color:#d4b978}.downloads{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}.controls{display:flex;gap:7px}.controls select{flex:1}.controls button{padding:9px}.status{color:#b5b1a7;font-size:12px;min-height:32px;margin:9px 0 0;overflow-wrap:anywhere}.status.error{color:#ff9b83}#summary{color:#b5b1a7;margin:10px 0 0}.placeholder{color:#b5b1a7;font-size:12px;padding:12px;text-align:center}.empty{grid-column:1/-1;color:#b5b1a7}@media(max-width:600px){header{position:static;padding:16px}.filters>*{flex:1;min-width:130px}main{padding:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
</style><link rel="stylesheet" href="/beauty.css"></head><body class="beauty"><header><h1>WAHA / Модели и анимации</h1><div class="filters">
<input id="search" placeholder="Поиск юнита, здания или точки" aria-label="Поиск">
<select id="faction" aria-label="Фракция"><option value="">Все фракции</option></select>
<select id="motion" aria-label="Анимация"><option value="">Все доступные анимации</option></select>
<select id="direction" aria-label="Направление"><option value="0">Ракурс 0°</option><option value="45">Ракурс 45°</option><option value="90">Ракурс 90°</option><option value="135">Ракурс 135°</option><option value="180">Ракурс 180°</option><option value="225">Ракурс 225°</option><option value="270">Ракурс 270°</option><option value="315">Ракурс 315°</option></select>
</div><div class="playback"><label><input id="playing" type="checkbox" checked>Воспроизведение</label><label><input id="repeat" type="checkbox" checked>Повторять однократные действия</label><a href="/project-hub.html">Все экраны ↗</a></div><p id="summary">Загрузка каталога…</p></header><main id="catalog"></main>
<script type="module">
import { validateAtlas, atlasFrame } from './sprite-atlas.ts';
const base='/models/factions/';
const $=id=>document.getElementById(id);
const catalog=$('catalog'),active=new Set();
const name={legion:'Космодесант',heretics:'Хаос',scrap:'Орки',necrons:'Некроны',drukhari:'Тёмные Эльдар',daemons:'Демоны',common:'Общие эффекты'};
const roles={captain:'Капитан',guard:'Страж',builder:'Строитель',sniper:'Снайпер',heavy:'Тяжёлый стрелок',flamer:'Огнемётчик',elite:'Элита',medic:'Медик',transport:'Транспорт',tank:'Танк',walker:'Шагоход',artillery:'Артиллерия',titan:'Титан',scout:'Разведчик',flyer:'Летающий юнит',hq:'Штаб',barracks:'Казармы',post:'Пост',turret:'Турель',generator:'Генератор',factory:'Фабрика',armory:'Оружейная',relic:'Реликвия',wall:'Стена',gate:'Ворота',capture_point:'Точка захвата',resource_point:'Ресурсная точка',nuclear_blast:'Ядерный взрыв'};
const motions={idle:'Ожидание',idle_scan:'Осмотр',idle_inspect:'Проверка оружия',idle_taunt:'Насмешка',walk:'Ходьба',run:'Бег',attack:'Атака',attack_slash:'Рубящий удар',attack_thrust:'Выпад',attack_overhead:'Удар сверху',attack_combo:'Комбинация',execute:'Добивание',throw_grenade:'Бросок гранаты',fly:'Полёт',dash_flight:'Рывок в воздухе',teleport:'Телепортация',shoot:'Выстрел',reload:'Перезарядка',hit:'Попадание',work:'Работа',death:'Смерть',stunned:'Оглушение',knockback:'Отбрасывание',fall:'Падение',death_blast:'Гибель от взрыва',build:'Строительство',capture:'Захват',explode:'Взрыв',explosion:'Взрыв',blast:'Взрыв'};
const cache=new Map();
let files=[];
async function sheet(src){
  if(cache.has(src)){const cached=cache.get(src);cache.delete(src);cache.set(src,cached);return cached;}
  if(!cache.has(src))cache.set(src,(async()=>{
    const response=await fetch(src+'.json');
    if(!response.ok)throw Error('JSON: HTTP '+response.status);
    const metadata=validateAtlas(await response.json());
    const image=new Image();image.src=src+'.png';await image.decode();
    if(image.naturalWidth!==metadata.cellWidth*metadata.columns||image.naturalHeight!==metadata.cellHeight*metadata.rows)throw Error('Размер PNG не совпадает с JSON');
    return {image,metadata,src};
  })());
  // Avoid retaining every large decoded atlas after browsing all factions.
  while(cache.size>24)cache.delete(cache.keys().next().value);
  return cache.get(src);
}
const observer=new IntersectionObserver(entries=>{
  for(const entry of entries){
    const state=entry.target._previewState;if(!state)continue;state.visible=entry.isIntersecting;
    if(state.visible&&!state.atlas&&!state.pending)load(state);
    else if(!state.visible){state.token++;state.pending=false;state.atlas=null;state.lastFrame='';}
  }
});
function updateLinks(state){
  const src=base+state.file.faction+'/'+state.file.role+'/sprites/'+state.select.value;
  state.png.href=src+'.png';state.json.href=src+'.json';
}
async function load(state){
  if(!state.visible)return;
  const action=state.select.value,token=++state.token;
  state.pending=true;state.status.textContent='Загрузка анимации…';state.status.classList.remove('error');
  try{
    const atlas=await sheet(base+state.file.faction+'/'+state.file.role+'/sprites/'+action);
    if(token!==state.token||!state.card.isConnected)return;
    state.atlas=atlas;state.elapsed=0;state.lastFrame='';
    const a=atlas.metadata;
    state.status.textContent=a.directionsDegrees.length+' ракурсов · '+a.columns+' кадров · '+a.duration.toFixed(2)+' с · '+(a.loop?'цикл':'однократно');
    draw(state);
  }catch(error){if(token===state.token&&state.card.isConnected){state.status.textContent='Не удалось открыть '+action+': '+error.message;state.status.classList.add('error');}}
  finally{if(token===state.token)state.pending=false;}
}
function directionIndex(metadata){
  const wanted=Number($('direction').value);let nearest=0,distance=Infinity;
  metadata.directionsDegrees.forEach((angle,index)=>{const d=Math.abs(((angle-wanted)%360+540)%360-180);if(d<distance){nearest=index;distance=d;}});
  return nearest;
}
function draw(state){
  if(!state.atlas)return;
  const {metadata:a,image,src}=state.atlas;
  const frame=atlasFrame(a,state.elapsed,directionIndex(a));
  const key=src+':'+frame.x+':'+frame.y;
  if(state.lastFrame===key)return;state.lastFrame=key;
  const canvas=state.canvas,ctx=canvas.getContext('2d');
  ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,canvas.width,canvas.height);
  const scale=Math.min((canvas.width-16)/frame.w,(canvas.height-16)/frame.h);
  const w=frame.w*scale,h=frame.h*scale;
  // Keep the complete cell inside the preview; metadata contact is the pivot.
  const pivotX=(canvas.width-w)/2+a.anchor.x*scale;
  const pivotY=(canvas.height-h)/2+a.anchor.y*scale;
  ctx.drawImage(image,frame.x,frame.y,frame.w,frame.h,pivotX-a.anchor.x*scale,pivotY-a.anchor.y*scale,w,h);
}
function render(){
  observer.disconnect();active.clear();catalog.replaceChildren();
  const query=$('search').value.trim().toLowerCase(),faction=$('faction').value,motion=$('motion').value;
  const selected=files.filter(file=>(!faction||file.faction===faction)&&(!motion||(file.animations||[]).includes(motion))&&(!query||(file.faction+' '+file.role+' '+(name[file.faction]||'')+' '+(roles[file.role]||'')).toLowerCase().includes(query)));
  $('summary').textContent=selected.length+' моделей в каталоге · анимации загружаются при появлении карточки';
  if(!selected.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='Нет моделей для выбранного фильтра.';catalog.append(empty);return;}
  for(const file of selected){
    const card=document.createElement('article');card.className='unit';
    const title=document.createElement('h2');title.textContent=roles[file.role]||file.role;card.append(title);
    const subtitle=document.createElement('small');subtitle.textContent=(name[file.faction]||file.faction)+' / '+file.role;card.append(subtitle);
    const preview=document.createElement('div');preview.className='preview';card.append(preview);
    const canvas=document.createElement('canvas');canvas.width=160;canvas.height=160;canvas.setAttribute('aria-label','Анимация: '+title.textContent);preview.append(canvas);
    const downloads=document.createElement('div');downloads.className='downloads';
    if(file.file){const link=document.createElement('a');link.href=base+file.file;link.textContent='GLB ↓';link.download='';downloads.append(link);}
    const animations=file.animations||[];
    if(animations.length){
      const controls=document.createElement('div');controls.className='controls';
      const select=document.createElement('select');select.setAttribute('aria-label','Анимация '+file.role);
      for(const action of animations){const option=document.createElement('option');option.value=action;option.textContent=motions[action]||action;select.append(option);}
      select.value=motion&&animations.includes(motion)?motion:animations.includes('idle')?'idle':animations[0];
      const replay=document.createElement('button');replay.type='button';replay.textContent='↻';replay.title='Сначала';replay.setAttribute('aria-label','Повторить анимацию '+file.role);
      controls.append(select,replay);card.append(controls);
      const status=document.createElement('p');status.className='status';status.textContent='Прокрутите до карточки для просмотра.';card.append(status);
      const png=document.createElement('a');png.textContent='PNG ↓';png.download='';
      const json=document.createElement('a');json.textContent='JSON ↓';json.download='';downloads.append(png,json);
      const state={card,canvas,select,file,status,png,json,visible:false,pending:false,atlas:null,elapsed:0,lastFrame:'',token:0};
      updateLinks(state);card._previewState=state;active.add(state);
      select.addEventListener('change',()=>{state.token++;state.pending=false;state.atlas=null;state.elapsed=0;state.lastFrame='';canvas.getContext('2d').clearRect(0,0,160,160);updateLinks(state);if(state.visible)load(state);});
      replay.addEventListener('click',()=>{state.elapsed=0;state.lastFrame='';if(state.atlas)draw(state);else if(!state.pending)load(state);});
      observer.observe(card);
    }else{const placeholder=document.createElement('p');placeholder.className='status';placeholder.textContent='В опубликованном каталоге нет PNG-анимаций этой модели.';card.append(placeholder);}
    card.append(downloads);catalog.append(card);
  }
}
for(const id of ['search','faction','motion'])$(id).addEventListener(id==='search'?'input':'change',render);
$('direction').addEventListener('change',()=>{for(const state of active)if(state.visible)draw(state);});
try{
  const response=await fetch(base+'manifest.json');if(!response.ok)throw Error('HTTP '+response.status);
  const data=await response.json();files=data.files||[];
  for(const id of [...new Set(files.map(file=>file.faction))]){const option=document.createElement('option');option.value=id;option.textContent=name[id]||id;$('faction').append(option);}
  for(const action of [...new Set(files.flatMap(file=>file.animations||[]))].sort()){const option=document.createElement('option');option.value=action;option.textContent=motions[action]||action;$('motion').append(option);}
  $('faction').value=files.some(file=>file.faction==='legion')?'legion':files[0]?.faction||'';render();
}catch(error){$('summary').textContent='Не удалось загрузить manifest.json: '+error.message;}
let last=performance.now();
function tick(now){
  const dt=Math.min(0.1,(now-last)/1000);last=now;
  if(!document.hidden){for(const state of active){
    if(!state.visible||!state.atlas)continue;
    if($('playing').checked){
      state.elapsed+=dt;
      const a=state.atlas.metadata;
      if(!a.loop&&$('repeat').checked&&state.elapsed>a.duration+0.65)state.elapsed=0;
    }
    draw(state);
  }}
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script></body></html>
