name: Browser game smoke
on:
  workflow_dispatch:
  push:
    branches: [codex/faction-asset-lab]
    paths:
      - scripts/smoke-game.mjs
      - .github/workflows/browser-smoke.yml
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Test actual multiplayer browser loop
        run: node scripts/smoke-game.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-game-screenshot
          path: smoke-game.png
          if-no-files-found: ignore
