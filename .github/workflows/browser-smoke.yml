name: Browser game smoke
on:
  workflow_dispatch:
  push:
    branches: [codex/faction-asset-lab]
    paths:
      - 'client/**'
      - 'shared/**'
      - 'server/**'
      - 'scripts/**'
      - package.json
      - package-lock.json
      - .github/workflows/browser-smoke.yml
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: npm run assets:validate
      - name: Test six real multiplayer browser loops
        run: npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-faction-browser-qa
          path: artifacts/browser/
          if-no-files-found: error
