name: Export faction assets
on:
  workflow_dispatch:
    inputs:
      export_scope:
        description: "Export procedural prototypes: missing files or all (not final artwork)"
        type: choice
        options:
          - missing
          - all
        default: missing
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPORT_SCOPE: ${{ inputs.export_scope || 'missing' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Render and export sprite atlases
        run: node --import tsx scripts/export-factions.mjs
      - name: Validate all exported files
        run: node --import tsx scripts/audit-assets.mjs --require-complete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prototype-asset-audit
          path: assets/art-audit.json
      - run: npm run assets:glb
      - name: Verify model and sprite animation roundtrip
        run: npm run assets:check-pack
      - name: Package portable GLB and sprite assets
        run: npm run assets:pack
      - uses: actions/upload-artifact@v4
        with:
          name: WAHA-model-pack
          path: artifacts/WAHA-model-pack.zip
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/public/models/factions client/public/models/meshy-manifest.json assets/art-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "assets: export validated procedural prototypes (art approval pending)"
            git push
          fi
